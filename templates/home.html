<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Academic Outcome Predictor</title>
</head>

<body>
    <div class="login">
        <h1>Academic Assessment Analytics Portal</h1>

        <form action="{{ url_for('predict_datapoint')}}" method="post">
            <legend>
                <h2>Academic Outcome Forecast</h2>
            </legend>

            <div class="mb-3">
                <label class="form-label">Student Gender</label>
                <select class="form-control" name="gender" required>
                    <option class="placeholder" selected disabled value="">Choose Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Demographic Group</label>
                <select class="form-control" name="ethnicity" required>
                    <option class="placeholder" selected disabled value="">Choose Category</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Parental Education Background</label>
                <select class="form-control" name="parental_level_of_education" required>
                    <option class="placeholder" selected disabled value="">Choose Education Level</option>
                    <option value="associate's degree">Associate's Degree</option>
                    <option value="bachelor's degree">Bachelor's Degree</option>
                    <option value="high school">High School</option>
                    <option value="master's degree">Master's Degree</option>
                    <option value="some college">Some College</option>
                    <option value="some high school">Some High School</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Meal Plan Status</label>
                <select class="form-control" name="lunch" required>
                    <option class="placeholder" selected disabled value="">Choose Meal Plan</option>
                    <option value="free/reduced">Subsidized / Free</option>
                    <option value="standard">Standard Rate</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Prep Course Completion</label>
                <select class="form-control" name="test_preparation_course" required>
                    <option class="placeholder" selected disabled value="">Choose Prep Status</option>
                    <option value="none">Not Taken</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Reading Performance Score (0-100)</label>
                <input class="form-control" type="number" name="reading_score" placeholder="Provide Reading Score"
                    min="0" max="100" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Writing Performance Score (0-100)</label>
                <input class="form-control" type="number" name="writing_score" placeholder="Provide Writing Score"
                    min="0" max="100" required />
            </div>

            <div class="mb-3">
                <input class="btn btn-primary" type="submit" value="Calculate Mathematics Score" />
            </div>
        </form>

        <h2>Forecasted Result: {{results}}</h2>
    </div>
</body>

</html>
